name: Usage evidence
description: A real situation in which the discipline's text gave no answer, gave a wrong answer, or was systematically misread
title: "[usage-evidence]: "
labels: ["usage-evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Usage evidence is the only thing that reopens the frozen core. It is a concrete
        situation from real usage, not a hypothetical and not a reasoned argument alone.
        See GOVERNANCE.md for what counts.
  - type: textarea
    id: situation
    attributes:
      label: The situation
      description: What actually happened, in real usage, by a human or an agent.
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface and clause
      description: Which file and which clause was involved (for example "ESSENCE.md, floor 1").
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What the text said, and what it should have said
      description: The answer the text gave (or failed to give), and the answer the situation needed.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: What the practitioner actually did
    validations:
      required: true
  - type: dropdown
    id: class
    attributes:
      label: Your read of the class
      options:
        - One-off
        - Structural (recurring)
        - Not sure
    validations:
      required: true
